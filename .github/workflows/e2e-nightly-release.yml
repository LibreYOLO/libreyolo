# SECURITY: do not add `pull_request` to this workflow. A self-hosted runner
# attached to a public repo would execute arbitrary code from fork PRs.

name: E2E nightly (release)

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Run regardless of SHA cache"
        type: boolean
        default: false
      ref:
        description: "Immutable tag to test (vX.Y.Z). Empty means current release tip."
        type: string
        default: ""

permissions:
  contents: read

jobs:
  guard:
    name: Resolve stale release target
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.diff.outputs.should_run }}
      target_sha: ${{ steps.resolve.outputs.target_sha }}
      target_label: ${{ steps.resolve.outputs.target_label }}
      cache_key: ${{ steps.resolve.outputs.cache_key }}
      cache_hit: ${{ steps.cache-target.outputs.cache-hit }}
    steps:
      - id: resolve
        name: Resolve release target SHA
        env:
          REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          # A tag pin is required after publish: refs/heads/release can move
          # between the GitHub release and this dispatch, and then the suite
          # would test a different commit than the one PyPI just got.
          if [ -n "${REF:-}" ]; then
            if ! printf '%s' "$REF" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "ref must look like vX.Y.Z, got: $REF"
              exit 1
            fi
            TARGET_SHA=$(git ls-remote https://github.com/LibreYOLO/libreyolo "refs/tags/${REF}^{}" | cut -f1)
            if [ -z "$TARGET_SHA" ]; then
              TARGET_SHA=$(git ls-remote https://github.com/LibreYOLO/libreyolo "refs/tags/${REF}" | cut -f1)
            fi
            if [ -z "$TARGET_SHA" ]; then
              echo "No such tag: $REF"
              exit 1
            fi
            TARGET_LABEL="tag ${REF}"
          else
            TARGET_SHA=$(git ls-remote https://github.com/LibreYOLO/libreyolo refs/heads/release | cut -f1)
            TARGET_LABEL="release tip"
          fi
          # The cache key carries an ISO week so a frozen target is still
          # retested once a week. A SHA-only key means a quiet branch is never
          # re-run, and the environment underneath it drifts untested.
          WINDOW=$(date -u +%G-W%V)
          echo "target_sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
          echo "target_label=$TARGET_LABEL" >> "$GITHUB_OUTPUT"
          echo "window=$WINDOW" >> "$GITHUB_OUTPUT"
          echo "cache_key=last-tested-nightly-release-$TARGET_SHA-$WINDOW" >> "$GITHUB_OUTPUT"
          echo "Resolved: ${TARGET_LABEL}=$TARGET_SHA window=$WINDOW"

      # restore, not cache: this job never creates the marker file, so the
      # save-on-post of actions/cache would warn every run and could claim the
      # key with nothing in it.
      - id: cache-target
        uses: actions/cache/restore@v4
        with:
          path: .last-release
          key: ${{ steps.resolve.outputs.cache_key }}

      - id: diff
        name: Decide whether release needs testing
        env:
          FORCE: ${{ inputs.force }}
          HIT_TARGET: ${{ steps.cache-target.outputs.cache-hit }}
          TARGET_SHA: ${{ steps.resolve.outputs.target_sha }}
          TARGET_LABEL: ${{ steps.resolve.outputs.target_label }}
          WINDOW: ${{ steps.resolve.outputs.window }}
        run: |
          set -euo pipefail
          if [ "${FORCE:-false}" = "true" ]; then
            SHOULD_RUN=true
            REASON="forced by workflow_dispatch input"
          elif [ "${HIT_TARGET:-}" = "true" ]; then
            SHOULD_RUN=false
            REASON="${TARGET_LABEL}@${TARGET_SHA} already passed a nightly in week ${WINDOW}"
          else
            SHOULD_RUN=true
            REASON="no passing nightly recorded for ${TARGET_LABEL}@${TARGET_SHA} in week ${WINDOW}"
          fi
          echo "should_run=$SHOULD_RUN" >> "$GITHUB_OUTPUT"
          echo "Should run release: $SHOULD_RUN ($REASON)"

          # Every run says, in its own summary, which SHA it covers and whether
          # it actually tested it. A skipped run is green; without this line it
          # is indistinguishable from a pass in the run list.
          if [ "$SHOULD_RUN" = "true" ]; then
            VERDICT="RUNNING the GPU suite"
          else
            VERDICT="SKIPPED, no GPU suite ran in this run"
          fi
          {
            echo "### Nightly guard: $VERDICT"
            echo
            echo "- Target: \`${TARGET_LABEL}@${TARGET_SHA}\`"
            echo "- Week window: \`${WINDOW}\`"
            echo "- Reason: ${REASON}"
            echo
            if [ "$SHOULD_RUN" != "true" ]; then
              echo "This run did **not** execute the GPU suite. The green tick"
              echo "means the guard resolved cleanly, not that this commit was"
              echo "tested in this run. The pass it is standing on is an earlier"
              echo "run against the same SHA."
              echo
              echo "To test it anyway: re-dispatch with \`force=true\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  skipped:
    name: Skipped (release already tested)
    needs: guard
    if: needs.guard.outputs.should_run == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Explain the skip
        run: |
          echo "No GPU suite ran. ${{ needs.guard.outputs.target_label }}@${{ needs.guard.outputs.target_sha }} already"
          echo "passed a nightly this week. Re-dispatch with force=true to retest."

  e2e:
    name: e2e (release)
    needs: guard
    if: needs.guard.outputs.should_run == 'true'
    runs-on: [self-hosted, gpu, libreyolo-e2e]
    timeout-minutes: 180
    steps:
      # The resolved SHA, not the branch. This job tests whatever it checks
      # out, so a branch ref would let release move between the guard and the
      # checkout and mark one SHA as tested while having tested another.
      - name: Checkout the resolved release SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.guard.outputs.target_sha }}

      - uses: astral-sh/setup-uv@v4

      - name: Create venv
        run: uv venv --python 3.10

      - name: Install from source
        run: uv pip install --no-sources --torch-backend cu128 --group dev -e ".[rfdetr,onnx]"

      - name: GPU sanity
        run: uv run --no-sync python -c "import torch; print('CUDA:', torch.cuda.is_available(), torch.cuda.get_device_name(0) if torch.cuda.is_available() else '-')"

      - name: Record nightly suite contract
        shell: bash
        run: |
          set -euo pipefail
          if [ -f tests/e2e/nightly_contract.py ]; then
            uv run --no-sync python - <<'PY'
          import os
          from pathlib import Path

          from tests.e2e.nightly_contract import (
              nightly_markdown_summary,
              nightly_summary_line,
          )

          print(nightly_summary_line())
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with Path(summary_path).open("a", encoding="utf-8") as f:
                  f.write(nightly_markdown_summary())
                  f.write("\n")
          PY
          else
            msg="LibreYOLO nightly e2e suite: legacy pre-v1.0 (checked-out target has no versioned contract)"
            echo "$msg"
            if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
              {
                echo "### $msg"
                echo
                echo "This target predates the versioned nightly test contract."
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

      - name: Run e2e
        shell: bash
        run: |
          set -euo pipefail
          if grep -q '^test_nightly:' Makefile; then
            make test_nightly
          else
            echo "test_nightly target not present; running legacy pre-v1.0 e2e command"
            uv run --no-sync pytest tests/e2e -v -m "not export_backend"
          fi

      - name: Mark release as tested
        if: success()
        run: echo "ok ${{ github.run_id }}" > .last-release

      - name: Save tested-SHA cache
        if: success() && needs.guard.outputs.cache_hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .last-release
          key: ${{ needs.guard.outputs.cache_key }}
