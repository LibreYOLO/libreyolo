<!doctype html><html><head><meta charset="utf-8">
<!-- README banner. Same look as the hero row of the Recall Index card:
     dark navy card, thin cyan border, Outfit name, JetBrains Mono details.
     Render with headless Chrome: --window-size=1536,260 --force-device-scale-factor=1.5 --default-background-color=00000000 -->
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700&family=JetBrains+Mono:wght@400;500&display=block" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
html,body{width:1536px;height:260px;background:transparent}
.card{position:absolute;inset:6px;border-radius:26px;border:2px solid #155e75;
 background:linear-gradient(100deg,#0f172a 0%,#0f1f33 45%,#0d3442 100%);
 display:flex;align-items:center;padding:0 72px 0 60px}
.mark{width:132px;height:132px;flex:none;margin-right:34px}
.name{font-family:Outfit;font-weight:700;font-size:92px;letter-spacing:-2.5px;color:#fff;line-height:1}
.sub{font-family:'JetBrains Mono';font-weight:400;font-size:27px;color:#94a3b8;margin-top:12px;margin-left:4px}
.right{margin-left:auto;text-align:right}
.lab{font-family:Outfit;font-weight:600;font-size:25px;color:#94a3b8;margin-bottom:8px}
.cmd{font-family:'JetBrains Mono';font-weight:500;font-size:44px;color:#22d3ee;letter-spacing:-.5px}
</style></head>
<body><div class="card">
<svg class="mark" viewBox="0 0 400 400" fill-rule="evenodd"><path d="M86 86 L123.09 86 A78 78 0 0 1 276.91 86 L314 86 L314 123.09 A78 78 0 0 1 314 276.91 L314 314 L276.91 314 A78 78 0 0 1 123.09 314 L86 314 L86 276.91 A78 78 0 0 1 86 123.09 Z M116 116 L157.26 116 A46 46 0 1 1 242.74 116 L284 116 L284 157.26 A46 46 0 1 1 284 242.74 L284 284 L242.74 284 A46 46 0 1 1 157.26 284 L116 284 L116 242.74 A46 46 0 1 1 116 157.26 Z" fill="#fff"/></svg>
<div><div class="name">LibreYOLO</div><div class="sub">MIT licensed computer vision</div></div>
<div class="right"><div class="lab">install</div><div class="cmd">pip install libreyolo</div></div>
</div></body></html>
