# RF5 - native RF-DETR detection recipe
model_type: rfdetr
sizes:
  n: {imgsz: 384, lr0: 0.0001, weights: LibreRFDETRn.pt}
  s: {imgsz: 512, lr0: 0.0001, weights: LibreRFDETRs.pt}
  m: {imgsz: 576, lr0: 0.0001, weights: LibreRFDETRm.pt}
  l: {imgsz: 704, lr0: 0.0001, weights: LibreRFDETRl.pt}
epochs: 100
batch_size: 16
optimizer: adamw
weight_decay: 0.0001
scheduler: step
warmup_epochs: 0
ema: true
ema_decay: 0.993
amp: true
patience: 0
eval_interval: 1
save_period: 10
workers: 4
